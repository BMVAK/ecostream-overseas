<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="darkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="lightBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <radialGradient id="globeGradient">
      <stop offset="0%" stop-color="#e5e7eb" />
      <stop offset="100%" stop-color="#d1d5db" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="white"/>

  <!-- Gray globe base -->
  <circle cx="100" cy="100" r="80" fill="url(#globeGradient)" />

  <!-- White horizontal lines on globe -->
  <path
    d="M 30 100 Q 50 70, 100 60 T 170 100"
    stroke="white"
    stroke-width="6"
    fill="none"
    stroke-linecap="round"
  />
  <path
    d="M 30 100 Q 50 115, 100 120 T 170 100"
    stroke="white"
    stroke-width="6"
    fill="none"
    stroke-linecap="round"
  />
  <path
    d="M 30 100 Q 50 140, 100 145 T 170 100"
    stroke="white"
    stroke-width="6"
    fill="none"
    stroke-linecap="round"
  />

  <!-- Dark blue swoosh ellipse -->
  <ellipse
    cx="100"
    cy="100"
    rx="80"
    ry="45"
    fill="none"
    stroke="url(#darkBlue)"
    stroke-width="12"
    opacity="0.9"
  />

  <!-- Light blue swoosh -->
  <path
    d="M 30 70 Q 70 50, 140 80 Q 160 90, 170 110"
    stroke="url(#lightBlue)"
    stroke-width="20"
    fill="none"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- Dark blue bottom swoosh -->
  <path
    d="M 40 120 Q 80 140, 150 120"
    stroke="url(#darkBlue)"
    stroke-width="18"
    fill="none"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Airplane -->
  <g transform="translate(145, 50) rotate(45)">
    <path
      d="M 0 0 L -8 -15 L 0 -12 L 8 -15 Z"
      fill="url(#darkBlue)"
    />
    <ellipse cx="0" cy="-4" rx="3" ry="8" fill="url(#darkBlue)" />
    <path
      d="M -12 2 L 0 0 L 12 2"
      stroke="url(#darkBlue)"
      stroke-width="2"
      fill="none"
    />
  </g>

  <!-- Contrail -->
  <path
    d="M 140 55 Q 150 52, 155 58"
    stroke="white"
    stroke-width="1.5"
    fill="none"
    stroke-linecap="round"
    opacity="0.6"
  />
</svg>
